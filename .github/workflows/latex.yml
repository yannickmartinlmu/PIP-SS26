name: Build LaTeX PDF

on:
  push:
    paths:
      - 'paper/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile report.tex
        working-directory: paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error report.tex

      - name: Commit PDF back to repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f paper/report.pdf
          if git diff --cached --quiet; then
            echo "No changes to report.pdf"
          else
            git commit -m "ci: rebuild report.pdf [skip ci]"
            git push
          fi
